<style>
/* Layout: eine Handy-Spalte wie eine Story – Fortschrittsbalken, Kopf, quadratische Kartenbühne, Infokarte darunter */
@font-face { font-family: 'Big Shoulders Display'; font-weight: 800; font-display: swap; src: url(fonts/BigShouldersDisplay-800-latin.woff2) format('woff2'); }
@font-face { font-family: 'Big Shoulders Text'; font-weight: 700; font-display: swap; src: url(fonts/BigShouldersText-700-latin.woff2) format('woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 400; font-display: swap; src: url(fonts/Figtree-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 600; font-display: swap; src: url(fonts/Figtree-600-latin.woff2) format('woff2'); }
:root {
  --tief: #07121a; --nacht: #0f2433; --karte: #10283a; --schnee: #f3f6f9; --leise: #a9bccb; --linie: rgba(243, 246, 249, .16);
  --rot: #e92b2e; --rot-hell: #ff5a52; --rot-knopf: #c62828;
  --f-titel: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-label: 'Big Shoulders Text', 'Arial Narrow', sans-serif;
  --f-text: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ein: cubic-bezier(.16, 1, .3, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--tief); color: var(--schnee); font-family: var(--f-text); overflow: hidden; }
#app {
  position: relative; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding-block: 10px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  background: radial-gradient(120% 70% at 50% 0%, #17344a 0%, var(--tief) 70%);
}
#balken { display: flex; gap: 4px; }
#balken i { flex: 1; height: 3px; border-radius: 2px; background: var(--linie); overflow: hidden; }
#balken b { display: block; height: 100%; width: 0; background: var(--schnee); }
.kopf { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.kopf img { width: 28px; height: 28px; }
.kopf .name { font: 700 15px/1 var(--f-label); letter-spacing: .14em; text-transform: uppercase; }
.kopf .tag { font: 700 15px/1 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--rot-hell); }
.kopf .luft { flex: 1; }
.rund { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--linie); background: rgba(7, 18, 26, .5); color: var(--schnee); display: grid; place-items: center; cursor: pointer; padding: 0; }
.rund svg { width: 18px; height: 18px; }
.rund:focus-visible, .knopf:focus-visible, .zweit:focus-visible { outline: 2px solid var(--rot-hell); outline-offset: 2px; }

.buehne { position: relative; width: min(100%, 54svh); aspect-ratio: 1; max-width: 100%; align-self: center; border-radius: 16px; overflow: hidden; background: var(--nacht); flex: none; }
.buehne video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s ease; }
.buehne video.an { opacity: 1; }
.fotoebene { position: absolute; inset: 0; opacity: 0; transition: opacity .5s ease; }
#app[data-phase="fotos"] .fotoebene { opacity: 1; }
.foto { position: absolute; inset: 0; background-size: cover; opacity: 0; transition: opacity .8s ease; }
.foto.an { opacity: 1; animation: kb 4.8s ease-out forwards; }
@keyframes kb { from { transform: scale(1.03); } to { transform: scale(1.11); } }
#app.pausiert .foto.an { animation-play-state: paused; }
.fotoebene::after { content: ''; position: absolute; inset: auto 0 0; height: 42%; background: linear-gradient(transparent, rgba(7, 18, 26, .88)); pointer-events: none; }
.ort { position: absolute; left: 14px; top: 12px; z-index: 2; font: 800 24px/1 var(--f-titel); text-transform: uppercase; letter-spacing: .02em; padding-bottom: 5px; border-bottom: 3px solid var(--rot); text-shadow: 0 2px 10px rgba(0, 0, 0, .55); }
.unten { position: absolute; left: 14px; right: 14px; bottom: 26px; z-index: 2; display: flex; align-items: flex-end; gap: 10px; }
.unten .ft { flex: 1; min-width: 0; font: 600 16px/1.25 var(--f-text); }
.unten .fz { font: 700 15px/1 var(--f-label); letter-spacing: .1em; color: var(--leise); font-variant-numeric: tabular-nums; }
.nachweis { position: absolute; left: 14px; right: 14px; bottom: 8px; z-index: 2; font: 400 11px/1.2 var(--f-text); color: rgba(243, 246, 249, .85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 4px rgba(0, 0, 0, .7); }
.ort { max-width: calc(100% - 28px); }
.pausezeichen { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; opacity: 0; transition: opacity .2s; pointer-events: none; }
.pausezeichen span { font: 700 15px/1 var(--f-label); letter-spacing: .16em; text-transform: uppercase; background: rgba(7, 18, 26, .72); padding: 10px 14px; border-radius: 999px; }
#app.pausiert .pausezeichen { opacity: 1; }

#karte { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
#karte > * { opacity: 0; transform: translateY(10px); }
#karte.rein > * { opacity: 1; transform: none; transition: opacity .5s ease, transform .7s var(--ein); }
#karte.rein > *:nth-child(2) { transition-delay: .07s; } #karte.rein > *:nth-child(3) { transition-delay: .14s; }
#karte.rein > *:nth-child(4) { transition-delay: .21s; } #karte.rein > *:nth-child(5) { transition-delay: .28s; }
.kicker { display: flex; align-items: center; gap: 8px; font: 700 14px/1.1 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--leise); }
.kicker::before { content: ''; width: 22px; height: 3px; background: var(--rot); border-radius: 2px; flex: none; }
#karte h2 { margin: 0; font: 800 clamp(30px, 9.5vw, 46px)/.95 var(--f-titel); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
#karte ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
#karte li { position: relative; padding-left: 18px; font: 400 17px/1.35 var(--f-text); }
#karte li::before { content: ''; position: absolute; left: 0; top: .5em; width: 7px; height: 7px; border-radius: 50%; background: var(--rot); }
.zahlen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.zahlen div { background: var(--karte); border: 1px solid var(--linie); border-radius: 12px; padding: 9px 12px; display: flex; flex-direction: column; gap: 2px; }
.zahlen b { font: 800 34px/1 var(--f-titel); font-variant-numeric: tabular-nums; }
.zahlen span { font: 700 13px/1.1 var(--f-label); letter-spacing: .12em; text-transform: uppercase; color: var(--leise); }
.fuss { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 600 14px/1.3 var(--f-text); color: var(--leise); }
.dabei { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.knopf { display: block; text-align: center; text-decoration: none; background: var(--rot-knopf); color: #fff; font: 800 26px/1 var(--f-titel); text-transform: uppercase; letter-spacing: .03em; padding: 15px 16px; border-radius: 12px; }
.knopf small { display: block; margin-top: 6px; font: 400 13px/1.2 var(--f-text); text-transform: none; letter-spacing: 0; color: #fff; }
a.zweit { display: block; text-align: center; text-decoration: none; }
.zweit { background: none; border: 1px solid var(--linie); color: var(--schnee); font: 700 15px/1 var(--f-label); letter-spacing: .12em; text-transform: uppercase; padding: 11px 14px; border-radius: 12px; cursor: pointer; }
.nachweise { font: 400 11px/1.4 var(--f-text); color: var(--leise); }
#app[data-letzter] .buehne { width: min(100%, 30svh); }
#app[data-letzter] .zahlen { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
#app[data-letzter] .zahlen div { padding: 7px 8px; }
#app[data-letzter] .zahlen b { font-size: clamp(18px, 5.4vw, 22px); white-space: nowrap; }
#app[data-letzter] .zahlen span { font-size: 11px; letter-spacing: .06em; }
#app[data-letzter] #karte { overflow-y: auto; }

#start { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px;
  padding-block: 24px max(28px, env(safe-area-inset-bottom, 0px)); padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, rgba(7, 18, 26, .25) 0%, rgba(7, 18, 26, .7) 45%, var(--tief) 78%), url(media/S01.jpg) center 20% / cover no-repeat, var(--tief); }
#start .logo { width: 92px; height: 92px; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .5)); }
#start .klein { font: 700 15px/1.1 var(--f-label); letter-spacing: .16em; text-transform: uppercase; color: var(--leise); }
#start h1 { margin: 0; font: 800 clamp(58px, 18vw, 86px)/.88 var(--f-titel); text-transform: uppercase; }
#start h1 span { color: var(--rot); display: block; }
#start .ortzeile { font: 600 18px/1.3 var(--f-text); }
#start .hinweis { font: 400 13px/1.4 var(--f-text); color: var(--leise); }
#start .knopf { border: 0; cursor: pointer; width: 100%; }
#start .ohne { background: none; border: 0; color: var(--leise); font: 600 14px/1 var(--f-text); text-decoration: underline; cursor: pointer; padding: 6px; align-self: center; }
/* Willkommens-Erlebnis nach "Ich bin dabei": Schnee, Logo, Gondel, dann WhatsApp */
#willkommen { position: absolute; inset: 0; z-index: 30; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  background: radial-gradient(120% 80% at 50% 30%, #1d4563 0%, var(--nacht) 45%, var(--tief) 100%); }
#schnee { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.w-inhalt { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.w-logo { width: 120px; height: 120px; filter: drop-shadow(0 14px 30px rgba(0, 0, 0, .55)); animation: w-pop 1s var(--ein) both; }
.w-klein { font: 700 15px/1 var(--f-label); letter-spacing: .18em; text-transform: uppercase; color: var(--leise); animation: w-hoch .7s var(--ein) .35s both; }
.w-gross { font: 800 clamp(62px, 19vw, 92px)/.86 var(--f-titel); text-transform: uppercase; animation: w-hoch .8s var(--ein) .5s both; }
.w-gross span { color: var(--rot); display: inline-block; animation: w-wackel 1.2s ease-in-out 1.1s both; }
.w-seil { position: relative; width: min(320px, 80vw); height: 90px; animation: w-hoch .6s ease .8s both; }
.w-seil svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.w-gondel { animation: w-fahrt 2.6s cubic-bezier(.45, 0, .2, 1) 1s both; }
.w-text { font: 600 17px/1.35 var(--f-text); color: var(--schnee); animation: w-hoch .6s ease 1.2s both; }
.w-knopf { width: min(320px, 80vw); opacity: 0; transform: translateY(10px); transition: opacity .4s ease, transform .5s var(--ein); }
#willkommen.bereit .w-knopf { opacity: 1; transform: none; }
@keyframes w-pop { from { opacity: 0; transform: scale(.3) rotate(-160deg); } to { opacity: 1; transform: none; } }
@keyframes w-hoch { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes w-wackel { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg) scale(1.08); } 60% { transform: rotate(4deg) scale(1.04); } }
@keyframes w-fahrt { from { transform: translate(0, 0); } to { transform: translate(250px, -55px); } }
@media (prefers-reduced-motion: reduce) { .w-logo, .w-klein, .w-gross, .w-gross span, .w-seil, .w-gondel, .w-text { animation: none; } }
@media (prefers-reduced-motion: reduce) { .foto.an { animation: none; } #karte > *, #karte.rein > * { transition: none; transform: none; } .buehne video, .foto, .fotoebene { transition: none; } }
</style>

  }
  function balkenSetzen() {
    const s = S[idx]; if (!s) return;
    const v = vids.get(idx);
    let teil = 0;
    if (gestartet) {
      const fl = flugMs(s), r = restMs(s);
      const flug = phase === 'flug' ? (v && v.duration ? v.currentTime * 1000 : 0) : fl;
      const rr = phase === 'flug' ? 0 : Math.min(rest, r);
      teil = Math.min(1, (flug + rr) / (fl + r));
    }
    [...balken.children].forEach((i, k) => { i.firstChild.style.width = (k < idx ? 100 : k > idx ? 0 : teil * 100) + '%'; });
  }
  function schleife(t) {
    const dt = letzte ? Math.min(120, t - letzte) : 0; letzte = t;
    if (gestartet && !pausiert && !document.hidden) {
      const s = S[idx];
      if (phase === 'flug') {
        const v = vids.get(idx);
        if (!v || v.dataset.fehler || v.ended || (v.duration && v.currentTime >= v.duration - 0.08)) restStarten();
        else if (v.currentTime !== flugStand) { flugStand = v.currentTime; flugStandSeit = t; }
        else if (t - flugStandSeit > 12000) restStarten(); // haengt das Laden, geht es mit den Fotos weiter
      } else if (phase === 'fotos' || phase === 'halten') {
        rest += dt;
        if (phase === 'fotos') { const soll = Math.min(s.fotos.length - 1, Math.floor(rest / FOTO_MS)); if (soll !== fotoIdx) fotoZeigen(soll); }
        if (rest >= restMs(s)) { if (idx < S.length - 1) zeigeStopp(idx + 1); else rest = restMs(s); }
      }
    }
    balkenSetzen();
    requestAnimationFrame(schleife);
  }

  // ---------- Ton ----------
  function tonSetzen() {
    const b = $('#ton'); b.innerHTML = ton ? ICON_AN : ICON_AUS; b.setAttribute('aria-pressed', String(ton)); b.setAttribute('aria-label', ton ? 'Ton aus' : 'Ton an');
    if (ton && gestartet && !pausiert) { musik.volume = 0.6; musik.play().catch(() => { ton = false; tonSetzen(); }); } else musik.pause();
  }
  $('#ton').addEventListener('click', (e) => { e.stopPropagation(); ton = !ton; tonSetzen(); });

  // ---------- Start ----------
  function starten(mitTon) {
    ton = mitTon; gestartet = true; $('#start').hidden = true;
    if (ton) { musik.preload = 'auto'; }
    tonSetzen(); zeigeStopp(0);
  }
  $('#los').addEventListener('click', (e) => { e.stopPropagation(); starten(true); });
  $('#leise').addEventListener('click', (e) => { e.stopPropagation(); starten(false); });

  // ---------- Bedienung: tippen, halten, wischen, Tasten ----------
  let downX = 0, downY = 0, haltTimer = null, gehalten = false, aktiv = false;
  const ignorieren = (e) => !!e.target.closest('a, button, #start, #willkommen');
  app.addEventListener('pointerdown', (e) => {
    if (ignorieren(e) || !gestartet) return;
    aktiv = true; downX = e.clientX; downY = e.clientY; gehalten = false;
    clearTimeout(haltTimer); haltTimer = setTimeout(() => { gehalten = true; pause(true); }, 260);
  });
  app.addEventListener('pointerup', (e) => {
    if (!aktiv) return; aktiv = false; clearTimeout(haltTimer);
    if (gehalten) { pause(false); return; }
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { if (dx < 0) { if (idx < S.length - 1) zeigeStopp(idx + 1); } else if (idx > 0) zeigeStopp(idx - 1, 'ende'); return; }
    if (Math.abs(dy) > 40) return;
    const r = app.getBoundingClientRect();
    if (e.clientX - r.left < r.width * 0.33) zurueck(); else weiter();
  });
  app.addEventListener('pointercancel', () => { aktiv = false; clearTimeout(haltTimer); if (gehalten) pause(false); });
  app.addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('keydown', (e) => {
    if (!gestartet) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); starten(true); } return; }
    if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); weiter(); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); zurueck(); }
    else if (e.key === 'p' || e.key === 'k') pause(!pausiert);
    else if (e.key === 'm') { ton = !ton; tonSetzen(); }
  });
  document.addEventListener('visibilitychange', () => {
    const v = vids.get(idx);
    if (document.hidden) { musik.pause(); if (v) v.pause(); }
    else if (gestartet && !pausiert) { if (ton) musik.play().catch(() => { }); if (v && phase === 'flug') v.play().catch(() => { }); }
  });

  tonSetzen();
  karteBauen(S[0]); $('#tag').textContent = '';
  requestAnimationFrame(schleife);
})();
</script>
</body></html>
